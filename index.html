<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>筋トレ記録</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="styles.css?v=20260727-mobile">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="筋トレ記録">
        <header class="topbar">
          <div>
            <p class="eyebrow">Training Log</p>
            <h1>筋トレ記録</h1>
            <p class="store-meta">今日の種目、重量、回数をシンプルに残すログ</p>
          </div>
          <div class="today-card">
            <span id="todayLabel"></span>
            <strong id="weekCount">0回</strong>
          </div>
        </header>

        <section class="summary-grid" aria-label="サマリー">
          <article class="metric">
            <span>今週の合計</span>
            <strong id="weeklyVolume">0 kg</strong>
          </article>
          <article class="metric">
            <span>直近の種目数</span>
            <strong id="equipmentCount">0</strong>
          </article>
          <article class="metric">
            <span>自己ベスト</span>
            <strong id="bestLift">-</strong>
          </article>
        </section>

        <section class="content-grid">
          <form id="workoutForm" class="panel entry-panel">
            <div class="panel-heading">
              <h2 id="formTitle">セット記録</h2>
              <button class="icon-button" type="button" id="clearForm" title="入力をクリア" aria-label="入力をクリア">↺</button>
            </div>

            <label>
              日付
              <input type="date" id="dateInput" required>
            </label>

            <div class="input-row two">
              <label>
                部位
                <select id="areaInput" required></select>
              </label>
              <label>
                メニュー
                <select id="equipmentInput" required></select>
              </label>
            </div>

            <label>
              種目
              <select id="exerciseInput" required></select>
            </label>

            <div class="input-row">
              <label>
                重量 kg
                <input type="number" id="weightInput" min="0" step="0.5" placeholder="60" required>
              </label>
              <label>
                回数
                <input type="number" id="repsInput" min="1" step="1" placeholder="10" required>
              </label>
              <label>
                セット
                <input type="number" id="setsInput" min="1" step="1" value="3" required>
              </label>
            </div>

            <label>
              メモ
              <textarea id="noteInput" rows="3" placeholder="シート位置、グリップ、体調、次回の目標など"></textarea>
            </label>

            <button class="primary-button" type="submit" id="submitButton">記録する</button>
          </form>

          <section class="panel history-panel">
            <div class="panel-heading">
              <h2>履歴</h2>
              <div class="filter-group" aria-label="履歴フィルター">
                <button class="filter-button active" type="button" data-filter="all">全て</button>
                <button class="filter-button" type="button" data-filter="week">今週</button>
              </div>
            </div>
            <div id="historyList" class="history-list" aria-live="polite"></div>
          </section>

          <details class="panel equipment-panel">
            <summary class="preset-summary">
              <span>種目プリセット</span>
              <small>東戸塚店の設備一覧を表示</small>
            </summary>
            <div class="preset-content">
              <p class="source-note">よく使う種目に加えて、エニタイムフィットネス東戸塚店の掲載設備をすべて登録しています。台数・重量範囲は店舗公式情報に基づきます。</p>
              <div id="equipmentGuide" class="equipment-guide"></div>
            </div>
          </details>
        </section>
      </section>
    </main>

    <template id="workoutItemTemplate">
      <article class="workout-item">
        <div class="workout-main">
          <div>
            <time></time>
            <h3></h3>
            <p class="machine-name"></p>
          </div>
          <div class="history-actions">
            <button class="edit-button" type="button">編集</button>
            <button class="delete-button" type="button" title="削除" aria-label="削除">×</button>
          </div>
        </div>
        <div class="workout-stats"></div>
        <p class="workout-note"></p>
      </article>
    </template>

    <script src="app.js?v=20260727-equipment"></script>
  </body>
</html>
