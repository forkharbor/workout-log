<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>筋トレ記録</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="styles.css?v=20260805-equipment-memo">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="筋トレ記録">
        <header class="topbar">
          <div>
            <h1>筋トレ記録</h1>
          </div>
          <div class="today-card">
            <span id="todayLabel"></span>
            <strong id="weekCount">0日</strong>
          </div>
        </header>

        <section class="summary-grid" aria-label="サマリー">
          <article class="metric">
            <span>今週の記録</span>
            <strong id="weeklyDays">0日</strong>
          </article>
          <article class="metric">
            <span>直近の器具</span>
            <strong id="equipmentCount">0</strong>
          </article>
          <article class="metric">
            <span>今週の器具</span>
            <strong id="weeklyEquipment">0</strong>
          </article>
        </section>

        <section class="content-grid">
          <form id="workoutForm" class="panel entry-panel">
            <div class="panel-heading">
              <h2 id="formTitle">やった器具をメモ</h2>
              <button class="icon-button" type="button" id="clearForm" title="入力をクリア" aria-label="入力をクリア">↺</button>
            </div>

            <label>
              日付
              <input type="date" id="dateInput" required>
            </label>

            <fieldset class="equipment-fieldset">
              <legend>やった器具</legend>
              <p class="picker-help">複数選べます</p>
              <div id="equipmentPicker" class="equipment-picker"></div>
              <p id="selectionStatus" class="selection-status" aria-live="polite">0種類を選択中</p>
            </fieldset>

            <label>
              メモ
              <textarea id="noteInput" rows="2" placeholder="ひとことだけ（任意）"></textarea>
            </label>

            <button class="primary-button" type="submit" id="submitButton">まとめて記録</button>
          </form>

          <section class="panel history-panel">
            <div class="panel-heading">
              <h2>履歴</h2>
              <div class="filter-group" aria-label="履歴フィルター">
                <button class="filter-button active" type="button" data-filter="all">全て</button>
                <button class="filter-button" type="button" data-filter="week">今週</button>
              </div>
            </div>
            <div id="historyList" class="history-list" aria-live="polite"></div>
          </section>

        </section>
      </section>
    </main>

    <template id="workoutItemTemplate">
      <article class="workout-item">
        <div class="workout-main">
          <div>
            <time></time>
            <h3></h3>
          </div>
          <div class="history-actions">
            <button class="edit-button" type="button">編集</button>
            <button class="delete-button" type="button" title="削除" aria-label="削除">×</button>
          </div>
        </div>
        <div class="workout-stats"></div>
        <p class="workout-note"></p>
      </article>
    </template>

    <script src="app.js?v=20260805-equipment-memo"></script>
  </body>
</html>
