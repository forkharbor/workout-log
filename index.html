<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>エニタイム渋谷店 Workout Log</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="エニタイムフィットネス渋谷店向け筋トレ記録">
        <header class="topbar">
          <div class="brand-block">
            <img class="app-logo" src="logo.png" alt="" width="64" height="64">
            <div>
              <p class="eyebrow">Anytime Fitness Shibuya</p>
              <h1>渋谷店 筋トレ記録</h1>
              <p class="store-meta">渋谷サクラステージ SHIBUYAサイド B1-1F / Life Fitness中心</p>
            </div>
          </div>
          <div class="today-card">
            <span id="todayLabel"></span>
            <strong id="weekCount">0回</strong>
          </div>
        </header>

        <section class="summary-grid" aria-label="サマリー">
          <article class="metric">
            <span>今週の合計</span>
            <strong id="weeklyVolume">0 kg</strong>
          </article>
          <article class="metric">
            <span>直近の器具数</span>
            <strong id="equipmentCount">0</strong>
          </article>
          <article class="metric">
            <span>自己ベスト</span>
            <strong id="bestLift">-</strong>
          </article>
        </section>

        <section class="content-grid">
          <form id="workoutForm" class="panel entry-panel">
            <div class="panel-heading">
              <h2>セット記録</h2>
              <button class="icon-button" type="button" id="clearForm" title="入力をクリア" aria-label="入力をクリア">↺</button>
            </div>

            <label>
              日付
              <input type="date" id="dateInput" required>
            </label>

            <div class="input-row two">
              <label>
                エリア
                <select id="areaInput" required></select>
              </label>
              <label>
                器具
                <select id="equipmentInput" required></select>
              </label>
            </div>

            <label>
              種目
              <select id="exerciseInput" required></select>
            </label>

            <div class="input-row">
              <label>
                重量 kg
                <input type="number" id="weightInput" min="0" step="0.5" placeholder="60" required>
              </label>
              <label>
                回数
                <input type="number" id="repsInput" min="1" step="1" placeholder="10" required>
              </label>
              <label>
                セット
                <input type="number" id="setsInput" min="1" step="1" value="3" required>
              </label>
            </div>

            <label>
              メモ
              <textarea id="noteInput" rows="3" placeholder="シート位置、グリップ、体調、次回の目標など"></textarea>
            </label>

            <button class="primary-button" type="submit">記録する</button>
          </form>

          <section class="panel equipment-panel">
            <div class="panel-heading">
              <h2>渋谷店プリセット</h2>
            </div>
            <p class="source-note">公式の渋谷店ページに個別マシン一覧がないため、公式ページで確認できる店舗情報と、渋谷店紹介で挙がる器具を中心にしています。</p>
            <div id="equipmentGuide" class="equipment-guide"></div>
          </section>

          <section class="panel history-panel">
            <div class="panel-heading">
              <h2>履歴</h2>
              <div class="filter-group" aria-label="履歴フィルター">
                <button class="filter-button active" type="button" data-filter="all">全て</button>
                <button class="filter-button" type="button" data-filter="week">今週</button>
              </div>
            </div>
            <div id="historyList" class="history-list" aria-live="polite"></div>
          </section>
        </section>
      </section>
    </main>

    <template id="workoutItemTemplate">
      <article class="workout-item">
        <div class="workout-main">
          <div>
            <time></time>
            <h3></h3>
            <p class="machine-name"></p>
          </div>
          <button class="delete-button" type="button" title="削除" aria-label="削除">×</button>
        </div>
        <div class="workout-stats"></div>
        <p class="workout-note"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
